aid: apparta
name: Apparta
description: >-
  Apparta is a Colombian hospitality technology company providing a reservation-management
  and guest-engagement platform for restaurants, bars, and dining venues across Latin
  America (Bogota, Medellin, Cali, Barranquilla). The SaaS product covers AI-assisted
  table assignment and floor-plan zoning, no-show prevention with prepayments and
  cancellation policies, a WhatsApp AI chatbot for automated bookings, CRM campaigns
  over SMS/email/WhatsApp, POS integration, branded booking pages and digital menus,
  and marketing connectors to Google, Google Maps, Instagram, TripAdvisor, and Facebook.
  Apparta is offered in tiered monthly plans (Basico, Standard, Plus) and is a portfolio
  company of 500 Global. No public developer API or OpenAPI surface is published as of
  this profiling; higher tiers expose a WhatsApp Business API integration on behalf of
  venues rather than a first-party Apparta API.
